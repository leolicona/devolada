# Barrera de calidad en PR (CICD.md camino 1). No despliega a entornos estables.
name: CI
on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Enforcement spec-driven (regla de oro)
        run: node scripts/spec-lint.mjs
      - name: Typecheck
        run: pnpm -r --if-present typecheck
      - name: Tests
        run: pnpm -r --if-present test
      - name: Build
        run: pnpm -r --if-present build

  # Preview por PR (decisión D2 de CICD.md): la URL que revisa el cliente.
  # Se enciende con la variable de repo PREVIEW_ENABLED=true una vez
  # configurados CLOUDFLARE_API_TOKEN y las D1 remotas.
  preview:
    if: vars.PREVIEW_ENABLED == 'true'
    needs: calidad
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Preview del API (versión sin tráfico)
        working-directory: apps/api
        run: pnpm exec wrangler versions upload --env dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      # TODO: previews de apps/tienda y apps/admin cuando existan
