# PR quality gate (CICD.md path 1). Deploys nothing to stable environments.
name: CI
on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Story citations on tests (constitution VII)
        run: node scripts/spec-lint.mjs

      - name: Bank vocabulary in step with scripts/banks.data.md
        run: node scripts/gen-banks.mjs --check
      - name: Contrast and token law (docs/polish/dark-and-contrast.spec.md)
        run: node scripts/contrast-lint.mjs
      - name: Every wait that says so shows so (feedback-vocabulary-rollout SC-001)
        run: node scripts/pending-lint.mjs
      - name: Typecheck
        run: pnpm -r --if-present typecheck
      - name: Tests
        run: pnpm -r --if-present test
      - name: Build
        run: pnpm -r --if-present build

  # Per-PR preview (decision D2 in CICD.md): the URL the client reviews.
  # Enabled via the PREVIEW_ENABLED=true repo variable once
  # CLOUDFLARE_API_TOKEN and the remote D1 databases are configured.
  preview:
    if: vars.PREVIEW_ENABLED == 'true'
    needs: quality
    runs-on: ubuntu-latest
    # The Cloudflare token lives in environment secrets; previews target dev
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # A preview version binds the dev D1. Without this, any PR that adds
      # a migration shows a broken preview until it merges. Migrations here
      # are additive, so applying them early is safe for the live dev app.
      - name: D1 dev migrations (the preview shares the dev database)
        working-directory: apps/api
        run: pnpm exec wrangler d1 migrations apply devolada-db-dev --env dev --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      # The five uploads go through scripts/preview-upload.sh: a Worker
      # that does not exist yet (fresh account, first PR) warns instead of
      # failing — its first deploy happens on merge.
      - name: API preview (no-traffic version)
        working-directory: apps/api
        run: ../../scripts/preview-upload.sh devolada-api-dev --env dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Build admin (dev API baked in)
        working-directory: apps/admin
        run: VITE_API_URL="${{ vars.DEV_API_URL }}" pnpm build
      - name: Admin preview
        working-directory: apps/api
        run: ../../scripts/preview-upload.sh devolada-admin-dev --config ../admin/wrangler.jsonc --env dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Build payment page (dev API baked in)
        working-directory: apps/pago
        run: VITE_API_URL="${{ vars.DEV_API_URL }}" pnpm build
      - name: Payment page preview
        working-directory: apps/api
        run: ../../scripts/preview-upload.sh devolada-pago-dev --config ../pago/wrangler.jsonc --env dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      # landing-page D14: the fourth Worker takes the same path. The page
      # bakes the dev API address and its own dev host at build; the first
      # PR's upload warns instead of failing until the merge deploys it.
      - name: Build landing (dev API baked in)
        working-directory: apps/landing
        run: PUBLIC_API_URL="${{ vars.DEV_API_URL }}" PUBLIC_SITE_URL=https://dev.devoladapago.com pnpm build
      - name: Landing preview
        working-directory: apps/api
        run: ../../scripts/preview-upload.sh devolada-landing-dev --config ../landing/wrangler.jsonc --env dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      # cash-at-stores D29: the fifth Worker, the store app, the same path.
      # Better Auth ignores `*` origins, so a preview renders but cannot
      # sign in — as admin's preview today; the walk happens on red.dev.
      - name: Build store app (dev API baked in)
        working-directory: apps/red
        run: VITE_API_URL="${{ vars.DEV_API_URL }}" pnpm build
      - name: Store app preview
        working-directory: apps/api
        run: ../../scripts/preview-upload.sh devolada-red-dev --config ../red/wrangler.jsonc --env dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
