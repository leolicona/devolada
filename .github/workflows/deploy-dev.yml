# Continuous deployment to dev on every push to main (CICD.md path 2).
name: Deploy Dev
on:
  push:
    branches: [main]

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/spec-lint.mjs
      - name: Bank vocabulary in step with the docs
        run: node scripts/gen-banks.mjs --check
      - run: node scripts/contrast-lint.mjs
      # production-launch D2: the same set ci.yml runs on a PR. A deploy's
      # test job is never a subset of the PR gate.
      - name: Every wait that says so shows so (feedback-vocabulary-rollout SC-001)
        run: node scripts/pending-lint.mjs
      - run: pnpm -r --if-present typecheck
      - run: pnpm -r --if-present test
      - run: pnpm -r --if-present build

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: dev
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # CICD.md D3: the browser layer runs here, after the merge, not in
      # the PR loop. It builds its own previews and stubs the API, so it
      # gates the deploy without depending on it.
      - name: Install chromium for the browser layer
        run: pnpm exec playwright install --with-deps chromium
      - name: Responsive and contrast (docs/polish/responsive.spec.md)
        run: pnpm e2e
      # Scenario 9 of better-auth.spec.md: real API + virtual authenticator.
      # Boots wrangler + local D1; no Cloudflare credentials involved.
      - name: Passkey ceremony (better-auth.spec.md scenario 9)
        run: pnpm e2e:passkey
      - name: D1 dev migrations (before deploy)
        working-directory: apps/api
        run: pnpm exec wrangler d1 migrations apply devolada-db-dev --env dev --remote
      - name: Deploy dev API
        working-directory: apps/api
        run: pnpm exec wrangler deploy --env dev
      # TD-011: it must run *after* the deploy. `secret put` refuses while the
      # newest version is undeployed, and CI's per-PR `versions upload` (CICD
      # D2) leaves one behind almost always — which is why setting it from a
      # laptop fails. Right here, latest == deployed.
      # The guard is shell, not `if:` — the secrets context is not allowed in a
      # step condition, and using it there makes GitHub reject the whole file.
      - name: Sync worker secrets
        working-directory: apps/api
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          APICEP_TOKEN: ${{ secrets.APICEP_TOKEN }}
          PLATFORM_OPERATOR_EMAILS: ${{ secrets.PLATFORM_OPERATOR_EMAILS }}
        run: |
          # production-launch D5: sign-up requires a verified email, and
          # without this key the code is only logged (email/sender.ts). A
          # plain line scrolled past in a green run; a warning names what
          # will not work. Not a refusal — constitution VIII keeps
          # BETTER_AUTH_SECRET as the one.
          if [ -z "$RESEND_API_KEY" ]; then
            echo "::warning::No RESEND_API_KEY in the dev environment — nobody can finish signing up: the verification code is only logged (production-launch D5)."
          else
            printf '%s' "$RESEND_API_KEY" | pnpm exec wrangler secret put RESEND_API_KEY --env dev
          fi
          # Direct SPEI channel (direct-payment spec, consta-api-merge D9):
          # the validation engine runs inside the API now, and this is the
          # one secret validation depends on — the provider's credential.
          # Without it the payment pages answer "unavailable" instead of
          # breaking (constitution VIII). The same GitHub secret used to be
          # planted on the Consta Worker; it is re-pointed here, not
          # re-created.
          if [ -z "$APICEP_TOKEN" ]; then
            echo "::warning::No APICEP_TOKEN in the dev environment — the SPEI channel stays unavailable."
          else
            printf '%s' "$APICEP_TOKEN" | pnpm exec wrangler secret put APICEP_TOKEN --env dev
          fi
          # operator-panel D2: who may open /operador and write the
          # platform's rules. Unset means nobody can — the platform still
          # runs on its birth values (operator-panel D1).
          if [ -z "$PLATFORM_OPERATOR_EMAILS" ]; then
            echo "::warning::No PLATFORM_OPERATOR_EMAILS in the dev environment — the operator panel is closed to everyone (operator-panel D2)."
          else
            printf '%s' "$PLATFORM_OPERATOR_EMAILS" | pnpm exec wrangler secret put PLATFORM_OPERATOR_EMAILS --env dev
          fi
          # Required: Better Auth signs every session cookie with it
          # (better-auth.spec.md). Without it the deployed API would sign
          # with a public dev value — refuse to ship that.
          if [ -z "$BETTER_AUTH_SECRET" ]; then
            echo "::error::BETTER_AUTH_SECRET is not set in the dev environment. Sessions cannot ship signed with a public value."
            exit 1
          fi
          printf '%s' "$BETTER_AUTH_SECRET" | pnpm exec wrangler secret put BETTER_AUTH_SECRET --env dev
      # A secret that exists is not a secret that works. On 2026-08-18 this
      # step ran green while planting a token apiCEP answered 401 to, and the
      # failure then hid for six hours: Consta maps a provider 401 to
      # PROVIDER_ERROR, the api maps that to retryable, and direct payments
      # sat in `validating` showing the customer "Verificando tu pago" until
      # they expired. Same lesson as TD-011, one level down — there the
      # evidence was a skipped step going green, here it is a step that
      # succeeds with a value nothing validated.
      #
      # consta-api-merge D9: the credential lives on the API now (the engine
      # is a module of it), so the probe moved here, right after the sync
      # that planted it. Its body is measured knowledge and is unchanged.
      #
      # The probe spends one credit per deploy (production-launch D11).
      # An earlier version of this comment called it free, reasoning that an
      # empty body is rejected before apiCEP touches Banxico; measured
      # 2026-08-19, a request apiCEP rejects with 400 is billed all the same
      # (archive docs/integrations/apicep.md). One credit per deploy is
      # kept on purpose: the six-hour silence above cost far more. It
      # separates the only two answers that decide anything — 401 is our
      # credential, 400 is apiCEP telling us the credential was fine and
      # only the body was wrong. Anything else is the provider having a bad
      # day, which must not block a deploy.
      #
      # The URL matches the adapter's DEFAULT_BASE_URL: the dev env sets no
      # APICEP_BASE_URL, so this is the host the deployed Worker will use.
      - name: Verify the provider credential
        env:
          APICEP_TOKEN: ${{ secrets.APICEP_TOKEN }}
        run: |
          # CICD D6. apiCEP answers 401 for five different reasons and the
          # HTTP code alone cannot tell them apart, so this reads the body.
          # All five measured 2026-08-19:
          #
          #   no header / no "Bearer " prefix  Missing or invalid Authorization header
          #   leading whitespace in the value  Invalid API key format. Must start with sk_live_
          #   apicep_ shape, not recognised    Invalid or revoked API token
          #   sk_live_ shape, not recognised   API key not found
          #   trailing whitespace              tolerated — apiCEP trims it (HTTP 400, auth fine)
          #
          # The first version of this step reported every 401 as "revoked",
          # which sent a debugging session after the wrong cause.
          if [ -z "$APICEP_TOKEN" ]; then
            echo "::warning::No APICEP_TOKEN to verify; the sync step already warned."
            exit 0
          fi

          # A fingerprint, not the secret: enough to answer "is this the same
          # value as the one that works locally?" without printing either.
          #   printf '%s' "$TOKEN" | shasum -a 256 | cut -c1-12
          echo "APICEP_TOKEN: ${#APICEP_TOKEN} chars, sha256 $(printf '%s' "$APICEP_TOKEN" | sha256sum | cut -c1-12)"

          # Shape before network, because two of these never reach a verdict
          # a human would read correctly.
          if [ "$APICEP_TOKEN" != "$(printf '%s' "$APICEP_TOKEN" | tr -d '\n\r')" ]; then
            echo "::error::APICEP_TOKEN contains a newline or carriage return. In the Worker that builds an invalid Authorization header, fetch throws, and Consta answers 500 — retryable all the way down, i.e. the same six-hour silence by another road. Re-add the secret with no trailing line break."
            exit 1
          fi
          case "$APICEP_TOKEN" in
            [!\ \	]*) ;;
            *) echo "::error::APICEP_TOKEN starts with a space or a tab. Measured: apiCEP answers 401 'Invalid API key format'. Re-add the secret with no leading whitespace."; exit 1 ;;
          esac

          call() {
            curl -s -o /tmp/apicep-probe.txt -w '%{http_code}' --max-time 30 \
              -X POST https://api.apicep.cloud/validate-transfer \
              -H "Authorization: Bearer $APICEP_TOKEN" \
              -H 'Content-Type: application/json' \
              -d '{}'
          }
          code=$(call); body=$(cat /tmp/apicep-probe.txt)

          # "Missing or invalid Authorization header" means apiCEP did not see
          # a header we know curl sent. Observed once by hand, and a retry
          # succeeded — so it is treated as a flake worth one more try rather
          # than as grounds to fail a deploy.
          case "$body" in
            *"Missing or invalid Authorization header"*)
              echo "::warning::apiCEP did not see the Authorization header. Retrying once."
              sleep 3
              code=$(call); body=$(cat /tmp/apicep-probe.txt)
              ;;
          esac

          case "$code" in
            400)
              echo "apiCEP accepted the credential (HTTP 400 on an empty body, as expected)."
              ;;
            401)
              case "$body" in
                *"Invalid or revoked API token"*)
                  echo "::error::apiCEP rejected APICEP_TOKEN: the token is revoked or was never valid. Its shape is right, so this is the value itself. Mint one at app.apicep.cloud and update the dev environment secret."
                  ;;
                *"API key not found"*)
                  echo "::error::APICEP_TOKEN looks like an sk_live_ key and apiCEP does not know it. This repo runs on an apicep_ token (docs/integrations/apicep.md, Auth) — check the secret holds the right kind."
                  ;;
                *"Invalid API key format"*)
                  echo "::error::apiCEP could not parse APICEP_TOKEN. Measured cause: leading whitespace inside the secret. The shape check above should have caught it, so inspect the value byte for byte."
                  ;;
                *"Missing or invalid Authorization header"*)
                  echo "::error::apiCEP twice failed to see an Authorization header this step did send. Either apiCEP's auth layer is down, or the secret is empty in a way \$APICEP_TOKEN did not reveal. The fingerprint above says which."
                  ;;
                *)
                  echo "::error::apiCEP answered 401 with an unrecognised body: $body"
                  ;;
              esac
              echo "::error::The engine will answer PROVIDER_AUTH_FAILED on every attempt, and direct payments will sit in 'validating' until they expire."
              exit 1
              ;;
            *)
              echo "::warning::Unexpected HTTP $code from apiCEP — the credential could not be verified, so the deploy is not blocked. Body: $body"
              ;;
          esac
      - name: Build admin (dev API baked in)
        working-directory: apps/admin
        run: VITE_API_URL="${{ vars.DEV_API_URL }}" pnpm build
      - name: Deploy dev admin
        working-directory: apps/admin
        run: pnpm --filter @devolada/api exec wrangler deploy --config ../admin/wrangler.jsonc --env dev
      - name: Build payment page (dev API baked in)
        working-directory: apps/pago
        run: VITE_API_URL="${{ vars.DEV_API_URL }}" pnpm build
      - name: Deploy dev payment page
        working-directory: apps/pago
        run: pnpm --filter @devolada/api exec wrangler deploy --config ../pago/wrangler.jsonc --env dev
      - name: Smoke test
        run: |
          URL="${{ vars.DEV_API_URL }}"
          if [ -z "$URL" ]; then
            echo "::warning::DEV_API_URL not set; smoke skipped"
            exit 0
          fi
          # Retry up to 5 minutes: the first deploy after a custom-domain
          # change races certificate issuance (measured on the punto/admin
          # domain move: DNS resolved, TLS was not ready yet).
          for i in $(seq 1 10); do
            curl -sf "$URL/health" && exit 0
            echo "health not up yet (attempt $i), waiting 30s"
            sleep 30
          done
          echo "::error::Smoke failed: dev deployed but not responding after 5 minutes"
          exit 1
      # TODO: Playwright + axe E2E against dev (TESTING.md layer 4)
