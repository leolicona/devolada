# Continuous deployment to dev on every push to main (CICD.md path 2).
name: Deploy Dev
on:
  push:
    branches: [main]

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/spec-lint.mjs
      - run: pnpm -r --if-present typecheck
      - run: pnpm -r --if-present test
      - run: pnpm -r --if-present build

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: dev
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: D1 dev migrations (before deploy)
        working-directory: apps/api
        run: pnpm exec wrangler d1 migrations apply devolada-db-dev --env dev --remote
      - name: Deploy dev API
        working-directory: apps/api
        run: pnpm exec wrangler deploy --env dev
      - name: Build store PWA (dev API baked in)
        working-directory: apps/tienda
        run: VITE_API_URL="${{ vars.DEV_API_URL }}" pnpm build
      - name: Deploy dev store PWA
        working-directory: apps/tienda
        run: pnpm --filter @devolada/api exec wrangler deploy --config ../tienda/wrangler.jsonc --env dev
      # TODO: deploy apps/admin once it exists
      - name: Smoke test
        run: |
          URL="${{ vars.DEV_API_URL }}"
          if [ -z "$URL" ]; then
            echo "::warning::DEV_API_URL not set; smoke skipped"
            exit 0
          fi
          sleep 5
          curl -sf "$URL/health" || { echo "::error::Smoke failed: dev deployed but not responding"; exit 1; }
      # TODO: Playwright + axe E2E against dev (TESTING.md layer 4)
