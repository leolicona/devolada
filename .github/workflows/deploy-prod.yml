# Production via v* tag with approval gate (CICD.md path 3).
name: Deploy Prod
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/spec-lint.mjs
      - run: node scripts/contrast-lint.mjs
      - run: pnpm -r --if-present typecheck
      - run: pnpm -r --if-present test
      - run: pnpm -r --if-present build

  deploy:
    needs: test
    runs-on: ubuntu-latest
    # Environment with required reviewer: the job pauses here until human approval
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: D1 prod backup (before migrating)
        working-directory: apps/api
        run: pnpm exec wrangler d1 export devolada-db-prod --remote --output backup-prod.sql
      - uses: actions/upload-artifact@v4
        with:
          name: d1-backup-${{ github.ref_name }}
          path: apps/api/backup-prod.sql
          retention-days: 30
      - name: D1 prod migrations
        working-directory: apps/api
        run: pnpm exec wrangler d1 migrations apply devolada-db-prod --env prod --remote
      - name: Deploy prod API
        working-directory: apps/api
        run: pnpm exec wrangler deploy --env prod
      # TD-011, and see the note in deploy-dev.yml: after the deploy, never
      # before it.
      # BETTER_AUTH_SECRET is required here, not optional: it signs every
      # session cookie (better-auth.spec.md). The build fails without it.
      - name: Sync worker secrets
        working-directory: apps/api
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
        run: |
          if [ -z "$BETTER_AUTH_SECRET" ]; then
            echo "::error::BETTER_AUTH_SECRET is not set in the production environment."
            echo "Without it the API signs sessions with a public dev value."
            echo "Refusing to finish a prod deploy."
            exit 1
          fi
          printf '%s' "$BETTER_AUTH_SECRET" | pnpm exec wrangler secret put BETTER_AUTH_SECRET --env prod
          if [ -z "$RESEND_API_KEY" ]; then
            echo "No RESEND_API_KEY in the production environment — skipping (TD-011)."
          else
            printf '%s' "$RESEND_API_KEY" | pnpm exec wrangler secret put RESEND_API_KEY --env prod
          fi
      - name: Build store PWA (prod API baked in)
        working-directory: apps/tienda
        run: VITE_API_URL="${{ vars.PROD_API_URL }}" pnpm build
      - name: Deploy prod store PWA
        working-directory: apps/tienda
        run: pnpm --filter @devolada/api exec wrangler deploy --config ../tienda/wrangler.jsonc --env prod
      - name: Build admin (prod API baked in)
        working-directory: apps/admin
        run: VITE_API_URL="${{ vars.PROD_API_URL }}" pnpm build
      - name: Deploy prod admin
        working-directory: apps/admin
        run: pnpm --filter @devolada/api exec wrangler deploy --config ../admin/wrangler.jsonc --env prod
      # The page deploys; the channel stays "unavailable" until Consta has
      # a prod env (direct-payment spec: no CONSTA_BASE_URL in prod vars).
      - name: Build payment page (prod API baked in)
        working-directory: apps/pago
        run: VITE_API_URL="${{ vars.PROD_API_URL }}" pnpm build
      - name: Deploy prod payment page
        working-directory: apps/pago
        run: pnpm --filter @devolada/api exec wrangler deploy --config ../pago/wrangler.jsonc --env prod
      - name: Smoke test
        run: |
          URL="${{ vars.PROD_API_URL }}"
          if [ -z "$URL" ]; then
            echo "::warning::PROD_API_URL not set; smoke skipped"
            exit 0
          fi
          # Retry up to 5 minutes: the first deploy after a custom-domain
          # change races certificate issuance (see deploy-dev.yml).
          for i in $(seq 1 10); do
            curl -sf "$URL/health" && exit 0
            echo "health not up yet (attempt $i), waiting 30s"
            sleep 30
          done
          echo "::error::Smoke failed: consider wrangler rollback (CICD.md)"
          exit 1
