# Production via v* tag with approval gate (CICD.md path 3).
name: Deploy Prod
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/spec-lint.mjs
      - run: pnpm -r --if-present typecheck
      - run: pnpm -r --if-present test
      - run: pnpm -r --if-present build

  deploy:
    needs: test
    runs-on: ubuntu-latest
    # Environment with required reviewer: the job pauses here until human approval
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: D1 prod backup (before migrating)
        working-directory: apps/api
        run: pnpm exec wrangler d1 export devolada-db-prod --remote --output backup-prod.sql
      - uses: actions/upload-artifact@v4
        with:
          name: d1-backup-${{ github.ref_name }}
          path: apps/api/backup-prod.sql
          retention-days: 30
      - name: D1 prod migrations
        working-directory: apps/api
        run: pnpm exec wrangler d1 migrations apply devolada-db-prod --env prod --remote
      - name: Deploy prod API
        working-directory: apps/api
        run: pnpm exec wrangler deploy --env prod
      # TODO: deploy apps/tienda and apps/admin once they exist
      - name: Smoke test
        run: |
          URL="${{ vars.PROD_API_URL }}"
          if [ -z "$URL" ]; then
            echo "::warning::PROD_API_URL not set; smoke skipped"
            exit 0
          fi
          sleep 5
          curl -sf "$URL/health" || { echo "::error::Smoke failed: consider wrangler rollback (CICD.md)"; exit 1; }
