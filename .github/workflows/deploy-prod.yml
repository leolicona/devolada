# Production via v* tag (CICD.md path 3); the tag is the approval (production-launch D3).
# The runbook — pre-flight, release, verification, undo — is
# specs/006-production-launch/quickstart.md (production-launch).
name: Deploy Prod
on:
  push:
    tags: ["v*"]
  # Re-plant a credential added after launch without a new tag: same gate,
  # same archive; the code is redeployed unchanged. The click is the
  # deliberate act, and the environment's policy admits `main` only
  # (production-launch D3).
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  # production-launch D1: a release is a main commit whose Deploy Dev run
  # finished green. The browser layer (pnpm e2e) and the passkey ceremony
  # run only on merge to main (deploy-dev.yml), so this job asks the
  # repository for that run instead of repeating them — 8–10 minutes and a
  # chromium install to re-prove a commit that already proved itself, and a
  # flaky re-run could block a hotfix dev already accepted. Nothing below
  # starts until this passes — and since the tag is the approval
  # (production-launch D3, constitution v1.4.0), this gate is what makes
  # that approval safe: production is never touched on an ungated commit. A
  # commit that is not on main has no dev run at all and is refused for the
  # same reason.
  gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The commit's dev deploy finished green
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # `head_sha` is exact — the run for this commit, on whatever ref
          # it ran. "Green" means finished and successful; a run still in
          # progress has no conclusion and does not count.
          green=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-dev.yml/runs?head_sha=${GITHUB_SHA}&per_page=10" \
            --jq '[.workflow_runs[] | select(.conclusion == "success")] | length')
          if [ "${green:-0}" -eq 0 ]; then
            echo "::error::No green Deploy Dev run for ${GITHUB_SHA}. Tag a main commit whose dev deploy finished green (production-launch D1)."
            exit 1
          fi
          echo "Deploy Dev is green for ${GITHUB_SHA} (${green} run(s))."
      - name: The commit is on main
        run: |
          git fetch --no-tags origin +main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::${GITHUB_SHA} is not on main. A release is a main commit (production-launch D1)."
            exit 1
          fi
          echo "${GITHUB_SHA} is on main."

  test:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/spec-lint.mjs
      - name: Bank vocabulary in step with the docs
        run: node scripts/gen-banks.mjs --check
      - run: node scripts/contrast-lint.mjs
      # production-launch D2: the same set ci.yml runs on a PR. A tag's test
      # job is never a subset of the PR gate.
      - name: Every wait that says so shows so (feedback-vocabulary-rollout SC-001)
        run: node scripts/pending-lint.mjs
      - run: pnpm -r --if-present typecheck
      - run: pnpm -r --if-present test
      - run: pnpm -r --if-present build

  deploy:
    needs: test
    runs-on: ubuntu-latest
    # production-launch D3: the tag is the approval. There is no reviewer
    # pause here — GitHub sells that rule only above the Free plan for a
    # private repository (measured 2026-09-18: HTTP 422), and the creator
    # chose the push of a v* tag as the deliberate act over paying for the
    # click. What the environment does hold is the policy "tags v* and
    # main only", set outside this file; the runbook's pre-flight checks
    # it is there. The gate job above is what keeps the act safe.
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Empty on the very first release — correct: the archive is the
      # restore point, and there was nothing to restore to yet.
      - name: D1 prod backup (before migrating)
        working-directory: apps/api
        run: pnpm exec wrangler d1 export devolada-db-prod --remote --output backup-prod.sql
      - uses: actions/upload-artifact@v4
        with:
          name: d1-backup-${{ github.ref_name }}
          path: apps/api/backup-prod.sql
          retention-days: 30
      - name: D1 prod migrations
        working-directory: apps/api
        run: pnpm exec wrangler d1 migrations apply devolada-db-prod --env prod --remote
      # production-launch D12: each deploy's output is kept so the last step
      # can say which version went live (FR-009). `shell: bash` sets
      # `-eo pipefail`, so a failed deploy still fails the step through the
      # tee.
      - name: Deploy prod API
        working-directory: apps/api
        shell: bash
        run: pnpm exec wrangler deploy --env prod 2>&1 | tee "$RUNNER_TEMP/deploy-api.log"
      # TD-011, and see the note in deploy-dev.yml: after the deploy, never
      # before it.
      # BETTER_AUTH_SECRET is required here, not optional: it signs every
      # session cookie (better-auth.spec.md). The build fails without it.
      - name: Sync worker secrets
        working-directory: apps/api
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          APICEP_TOKEN: ${{ secrets.APICEP_TOKEN }}
          PLATFORM_OPERATOR_EMAILS: ${{ secrets.PLATFORM_OPERATOR_EMAILS }}
        run: |
          if [ -z "$BETTER_AUTH_SECRET" ]; then
            echo "::error::BETTER_AUTH_SECRET is not set in the production environment."
            echo "Without it the API signs sessions with a public dev value."
            echo "Refusing to finish a prod deploy."
            exit 1
          fi
          printf '%s' "$BETTER_AUTH_SECRET" | pnpm exec wrangler secret put BETTER_AUTH_SECRET --env prod
          # production-launch D5: sign-up requires a verified email, and
          # without this key the code is only logged (email/sender.ts). A
          # plain line scrolled past in a green run; a warning names what
          # will not work. Not a refusal — constitution VIII keeps
          # BETTER_AUTH_SECRET as the one.
          if [ -z "$RESEND_API_KEY" ]; then
            echo "::warning::No RESEND_API_KEY in the production environment — nobody can finish signing up: the verification code is only logged (production-launch D5)."
          else
            printf '%s' "$RESEND_API_KEY" | pnpm exec wrangler secret put RESEND_API_KEY --env prod
          fi
          # operator-panel D2: who may open /operador and write the
          # platform's rules. Unset means nobody can — the platform still
          # runs on its birth values (operator-panel D1).
          if [ -z "$PLATFORM_OPERATOR_EMAILS" ]; then
            echo "::warning::No PLATFORM_OPERATOR_EMAILS in the prod environment — the operator panel is closed to everyone (operator-panel D2)."
          else
            printf '%s' "$PLATFORM_OPERATOR_EMAILS" | pnpm exec wrangler secret put PLATFORM_OPERATOR_EMAILS --env prod
          fi
          # consta-api-merge D9: the validation engine deploys with the API,
          # and whether production validates is decided by this one secret
          # (constitution VIII). This feature makes production ABLE to
          # validate and does not plant the credential — spending real
          # credits on real transfers is a separate decision (spec Q3).
          # Absent, the channel is unavailable and says so; the day the
          # secret is added to the production environment, the next deploy
          # plants it and nothing else changes.
          # production-launch D4 took that decision: on at launch, with a
          # token minted for production alone — never dev's, so a dev retry
          # can never spend a call a real payer depends on.
          if [ -z "$APICEP_TOKEN" ]; then
            echo "::warning::No APICEP_TOKEN in the production environment — the SPEI channel stays unavailable (consta-api-merge: switching production on is a separate decision)."
          else
            printf '%s' "$APICEP_TOKEN" | pnpm exec wrangler secret put APICEP_TOKEN --env prod
          fi
      # A secret that exists is not a secret that works. On 2026-08-18 this
      # step ran green while planting a token apiCEP answered 401 to, and the
      # failure then hid for six hours: Consta maps a provider 401 to
      # PROVIDER_ERROR, the api maps that to retryable, and direct payments
      # sat in `validating` showing the customer "Verificando tu pago" until
      # they expired. Same lesson as TD-011, one level down — there the
      # evidence was a skipped step going green, here it is a step that
      # succeeds with a value nothing validated.
      #
      # consta-api-merge D9: the credential lives on the API now (the engine
      # is a module of it), so the probe moved here, right after the sync
      # that planted it. Its body is measured knowledge and is unchanged.
      #
      # The probe spends one credit per release (production-launch D11).
      # An earlier version of this comment called it free, reasoning that an
      # empty body is rejected before apiCEP touches Banxico; measured
      # 2026-08-19, a request apiCEP rejects with 400 is billed all the same
      # (archive docs/integrations/apicep.md). One credit per release is
      # kept on purpose: the six-hour silence above cost far more. It
      # separates the only two answers that decide anything — 401 is our
      # credential, 400 is apiCEP telling us the credential was fine and
      # only the body was wrong. Anything else is the provider having a bad
      # day, which must not block a deploy.
      #
      # The URL matches the adapter's DEFAULT_BASE_URL: the prod env sets no
      # APICEP_BASE_URL, so this is the host the deployed Worker will use.
      # Exits 0 with a warning while the secret is absent — which is this
      # feature's own after-state for production (consta-api-merge D9).
      - name: Verify the provider credential
        env:
          APICEP_TOKEN: ${{ secrets.APICEP_TOKEN }}
        run: |
          # CICD D6. apiCEP answers 401 for five different reasons and the
          # HTTP code alone cannot tell them apart, so this reads the body.
          # All five measured 2026-08-19:
          #
          #   no header / no "Bearer " prefix  Missing or invalid Authorization header
          #   leading whitespace in the value  Invalid API key format. Must start with sk_live_
          #   apicep_ shape, not recognised    Invalid or revoked API token
          #   sk_live_ shape, not recognised   API key not found
          #   trailing whitespace              tolerated — apiCEP trims it (HTTP 400, auth fine)
          #
          # The first version of this step reported every 401 as "revoked",
          # which sent a debugging session after the wrong cause.
          if [ -z "$APICEP_TOKEN" ]; then
            echo "::warning::No APICEP_TOKEN to verify; the sync step already warned. Production is able to validate and not switched on."
            exit 0
          fi

          # A fingerprint, not the secret: enough to answer "is this the same
          # value as the one that works locally?" without printing either.
          #   printf '%s' "$TOKEN" | shasum -a 256 | cut -c1-12
          echo "APICEP_TOKEN: ${#APICEP_TOKEN} chars, sha256 $(printf '%s' "$APICEP_TOKEN" | sha256sum | cut -c1-12)"

          # Shape before network, because two of these never reach a verdict
          # a human would read correctly.
          if [ "$APICEP_TOKEN" != "$(printf '%s' "$APICEP_TOKEN" | tr -d '\n\r')" ]; then
            echo "::error::APICEP_TOKEN contains a newline or carriage return. In the Worker that builds an invalid Authorization header, fetch throws, and Consta answers 500 — retryable all the way down, i.e. the same six-hour silence by another road. Re-add the secret with no trailing line break."
            exit 1
          fi
          case "$APICEP_TOKEN" in
            [!\ \	]*) ;;
            *) echo "::error::APICEP_TOKEN starts with a space or a tab. Measured: apiCEP answers 401 'Invalid API key format'. Re-add the secret with no leading whitespace."; exit 1 ;;
          esac

          call() {
            curl -s -o /tmp/apicep-probe.txt -w '%{http_code}' --max-time 30 \
              -X POST https://api.apicep.cloud/validate-transfer \
              -H "Authorization: Bearer $APICEP_TOKEN" \
              -H 'Content-Type: application/json' \
              -d '{}'
          }
          code=$(call); body=$(cat /tmp/apicep-probe.txt)

          # "Missing or invalid Authorization header" means apiCEP did not see
          # a header we know curl sent. Observed once by hand, and a retry
          # succeeded — so it is treated as a flake worth one more try rather
          # than as grounds to fail a deploy.
          case "$body" in
            *"Missing or invalid Authorization header"*)
              echo "::warning::apiCEP did not see the Authorization header. Retrying once."
              sleep 3
              code=$(call); body=$(cat /tmp/apicep-probe.txt)
              ;;
          esac

          case "$code" in
            400)
              echo "apiCEP accepted the credential (HTTP 400 on an empty body, as expected)."
              ;;
            401)
              case "$body" in
                *"Invalid or revoked API token"*)
                  echo "::error::apiCEP rejected APICEP_TOKEN: the token is revoked or was never valid. Its shape is right, so this is the value itself. Mint one at app.apicep.cloud and update the production environment secret."
                  ;;
                *"API key not found"*)
                  echo "::error::APICEP_TOKEN looks like an sk_live_ key and apiCEP does not know it. This repo runs on an apicep_ token (docs/integrations/apicep.md, Auth) — check the secret holds the right kind."
                  ;;
                *"Invalid API key format"*)
                  echo "::error::apiCEP could not parse APICEP_TOKEN. Measured cause: leading whitespace inside the secret. The shape check above should have caught it, so inspect the value byte for byte."
                  ;;
                *"Missing or invalid Authorization header"*)
                  echo "::error::apiCEP twice failed to see an Authorization header this step did send. Either apiCEP's auth layer is down, or the secret is empty in a way \$APICEP_TOKEN did not reveal. The fingerprint above says which."
                  ;;
                *)
                  echo "::error::apiCEP answered 401 with an unrecognised body: $body"
                  ;;
              esac
              echo "::error::The engine will answer PROVIDER_AUTH_FAILED on every attempt, and direct payments will sit in 'validating' until they expire."
              exit 1
              ;;
            *)
              echo "::warning::Unexpected HTTP $code from apiCEP — the credential could not be verified, so the deploy is not blocked. Body: $body"
              ;;
          esac
      - name: Build admin (prod API baked in)
        working-directory: apps/admin
        run: VITE_API_URL="${{ vars.PROD_API_URL }}" pnpm build
      - name: Deploy prod admin
        working-directory: apps/admin
        shell: bash
        run: pnpm --filter @devolada/api exec wrangler deploy --config ../admin/wrangler.jsonc --env prod 2>&1 | tee "$RUNNER_TEMP/deploy-admin.log"
      # The page deploys; the channel stays "unavailable" until APICEP_TOKEN
      # is planted in the production environment — no code change needed
      # then (consta-api-merge, spec Q3).
      - name: Build payment page (prod API baked in)
        working-directory: apps/pago
        run: VITE_API_URL="${{ vars.PROD_API_URL }}" pnpm build
      - name: Deploy prod payment page
        working-directory: apps/pago
        shell: bash
        run: pnpm --filter @devolada/api exec wrangler deploy --config ../pago/wrangler.jsonc --env prod 2>&1 | tee "$RUNNER_TEMP/deploy-pago.log"
      # landing-page D14/FR-032: the fourth Worker, on the apex and www;
      # the page bakes the prod API address and its own host at build.
      - name: Build landing (prod API baked in)
        working-directory: apps/landing
        run: PUBLIC_API_URL="${{ vars.PROD_API_URL }}" PUBLIC_SITE_URL=https://devoladapago.com pnpm build
      - name: Deploy prod landing
        working-directory: apps/landing
        shell: bash
        run: pnpm --filter @devolada/api exec wrangler deploy --config ../landing/wrangler.jsonc --env prod 2>&1 | tee "$RUNNER_TEMP/deploy-landing.log"
      # production-launch D12 (FR-009): the one place the creator reads after
      # approving — which version of each service is live and which archive
      # was taken. The ids are what rollback-prod.yml takes as input, which
      # is why this runs even when a later step fails: a red smoke needs
      # them most.
      - name: What landed
        if: always()
        run: |
          {
            echo "## What landed — ${{ github.ref_name }}"
            echo
            echo "| service | version id |"
            echo "| --- | --- |"
            for w in api admin pago landing; do
              id=$(grep -o 'Current Version ID: [0-9a-f-]*' "$RUNNER_TEMP/deploy-$w.log" 2>/dev/null | tail -1 | awk '{print $4}')
              echo "| devolada-$w | ${id:-not deployed in this run} |"
            done
            echo
            echo "Archive before migrating: artifact \`d1-backup-${{ github.ref_name }}\` (kept 30 days)."
            echo "Undo: Actions → Rollback Prod with the service and the version id (production-launch D7)."
          } | tee -a "$GITHUB_STEP_SUMMARY"
      # production-launch D6: four services, their custom domains, as many
      # certificate races — /health proves only the API. An assets Worker
      # with single-page-application fallback answers / with 200 and the
      # shell, and the landing answers / with its page, so one probe serves
      # all four. Every URL is tried before the step fails, so one red log
      # names every host that did not answer.
      - name: Smoke test
        run: |
          failed=0
          probe() {
            name="$1"; base="$2"; path="$3"
            if [ -z "$base" ]; then
              echo "::warning::PROD_${name^^}_URL not set; $name smoke skipped"
              return 0
            fi
            url="$base$path"
            # Retry up to 5 minutes: the first deploy after a custom-domain
            # change races certificate issuance (see deploy-dev.yml).
            for i in $(seq 1 10); do
              if curl -sf -o /dev/null "$url"; then
                echo "$name answered: $url"
                return 0
              fi
              echo "$name not up yet (attempt $i), waiting 30s"
              sleep 30
            done
            # production-launch D14: the red log points at the undo that
            # exists, not at the archive's runbook.
            echo "::error::$url did not answer in 5 minutes. To return a service to its previous version run Actions → Rollback Prod (production-launch D7)."
            return 1
          }
          probe api   "${{ vars.PROD_API_URL }}"   "/health" || failed=1
          probe admin "${{ vars.PROD_ADMIN_URL }}" "/"       || failed=1
          probe pago  "${{ vars.PROD_PAGO_URL }}"  "/"       || failed=1
          probe landing "${{ vars.PROD_LANDING_URL }}" "/"   || failed=1
          exit $failed
